[project]
name = "sc2scala"
dynamic = ["version"]
description = "Scala: StarCraft II ladders between bots, played on runners their members contribute"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Max Nusspickel", email = "max.nusspickel@gmail.com" }]
keywords = ["StarCraft", "StarCraft 2", "StarCraft II", "AI", "Bot", "Ladder"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment :: Real Time Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.28",
    "loguru>=0.7",
]

[project.urls]
Repository = "https://github.com/maxnus/scala"

[project.scripts]
sc2scala = "sc2scala.cli:main"

[project.optional-dependencies]
server = [
    "alembic>=1.16",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn>=0.34",
]
dev = [
    "sc2scala[server]",
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sc2scala/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sc2scala"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs Docker and the engine's images, and plays a match"]
# Starlette's test client asks for httpx2, which the server does not use.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.pyright]
include = ["src", "tests", "tools"]
# The test bots run in AI Arena's bot image, on python-sc2, which this environment does not hold.
exclude = ["tests/bots", "**/__pycache__", ".venv"]
pythonVersion = "3.12"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
